meta:
  environment: node.js
  toolchain: default
  version: "20"
build:
  command: npm install
run:
  command: node test.js   # <--- ИЗМЕНИЛИ С server.js НА test.js
  containerPort: 3000
  healthCheck:
    path: /api/status
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
