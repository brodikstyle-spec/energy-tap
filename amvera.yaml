meta:
  environment: node.js
  toolchain: default
  version: "20"
build:
  command: npm install
run:
  command: node server.js
  containerPort: 3000
  healthCheck:
    path: /api/status
    initialDelaySeconds: 30   # <-- УВЕЛИЧИЛИ ЗНАЧЕНИЕ
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 5
