<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>РОССЕТИ | ЭНЕРГОТАП</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f5f5f5, #e0e0e0);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .game-container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 48px;
            padding: 24px 20px 32px;
            box-shadow: 0 25px 50px rgba(0, 90, 157, 0.2);
            border: 1px solid rgba(0, 90, 157, 0.2);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .animation-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .lightning {
            position: absolute;
            color: #ffd700;
            filter: drop-shadow(0 0 15px #ffd700);
            animation: lightningFlash 0.8s ease-out forwards;
            z-index: 25;
            transform-origin: center;
            font-size: 2.5rem;
        }

        @keyframes lightningFlash {
            0% {
                opacity: 1;
                transform: scale(0.5) rotate(0deg);
            }
            50% {
                opacity: 1;
                transform: scale(1.5) rotate(15deg);
                filter: drop-shadow(0 0 30px #ffd700);
            }
            100% {
                opacity: 0;
                transform: scale(2) rotate(-15deg) translateY(-30px);
                filter: drop-shadow(0 0 40px #ffd700);
            }
        }

        @keyframes buttonPulse {
            0% { box-shadow: 0 12px 0 #002b4a, 0 20px 30px rgba(0, 90, 157, 0.4); }
            50% { box-shadow: 0 12px 0 #002b4a, 0 20px 40px rgba(0, 90, 157, 0.8); }
            100% { box-shadow: 0 12px 0 #002b4a, 0 20px 30px rgba(0, 90, 157, 0.4); }
        }

        .button-pulse {
            animation: buttonPulse 0.3s ease-out !important;
        }

        .button-press {
            transform: translateY(8px) !important;
            transition: transform 0.05s linear;
        }

        .counter-pop {
            animation: counterPop 0.2s ease-out;
        }

        @keyframes counterPop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); color: #003d6b; }
            100% { transform: scale(1); }
        }

        .logo-container {
            text-align: center;
            margin-bottom: 15px;
            padding: 8px 0;
            border-bottom: 2px solid rgba(0, 90, 157, 0.1);
        }

        .logo-container img {
            max-width: 220px;
            height: auto;
            margin-bottom: 8px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            text-align: center;
            color: #005a9d;
            margin-bottom: 4px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 16px;
            border-bottom: 1px dashed rgba(0, 90, 157, 0.3);
            padding-bottom: 12px;
        }

        .energy-card {
            background: linear-gradient(135deg, #f0f5fa, #e6ecf3);
            border-radius: 32px;
            padding: 16px;
            margin-bottom: 5px;
            border: 1px solid rgba(0, 90, 157, 0.3);
            box-shadow: 0 6px 0 rgba(0, 90, 157, 0.2);
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            color: #005a9d;
            font-size: 0.9rem;
        }

        .badge {
            background: rgba(0, 90, 157, 0.1);
            padding: 5px 12px;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #005a9d;
            border: 1px solid rgba(0, 90, 157, 0.3);
            font-weight: 600;
        }

        .megawatt-value {
            font-size: 4rem;
            font-weight: 900;
            text-align: center;
            line-height: 1;
            color: #005a9d;
            text-shadow: 0 0 20px rgba(0, 90, 157, 0.3);
            margin: 5px 0 4px;
            letter-spacing: 4px;
        }

        .mw-label {
            text-align: center;
            color: #005a9d;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 3px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .progress-bar-container {
            width: 100%;
            height: 12px;
            background: rgba(0, 90, 157, 0.1);
            border-radius: 20px;
            overflow: hidden;
            margin: 15px 0 5px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #005a9d, #ffd700);
            transition: width 0.3s ease;
            border-radius: 20px;
        }

        .tap-button {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #005a9d, #003d6b);
            border: none;
            margin: 20px auto 25px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.8rem;
            font-weight: 900;
            color: white;
            text-transform: uppercase;
            box-shadow: 0 12px 0 #002b4a, 0 20px 30px rgba(0, 90, 157, 0.4);
            transition: transform 0.05s linear, opacity 0.3s ease;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
            border: 4px solid #80b5dc;
            position: relative;
            z-index: 5;
        }

        .tap-button:active {
            transform: translateY(8px);
        }

        .tap-button.disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
            background: radial-gradient(circle at 30% 30%, #999, #666);
            box-shadow: 0 12px 0 #444;
        }

        .victory-message {
            text-align: center;
            color: #ffd700;
            font-size: 1.5rem;
            font-weight: 900;
            margin: 15px 0;
            text-shadow: 0 0 20px #ffd700;
            animation: victoryPulse 1.5s infinite;
        }

        @keyframes victoryPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .user-info {
            background: #f0f5fa;
            border-radius: 50px;
            padding: 12px 16px;
            margin: 20px 0 16px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(0, 90, 157, 0.3);
            font-size: 0.9rem;
        }

        .user-id-label {
            color: #005a9d;
            font-weight: 600;
        }

        .user-id-value {
            color: #005a9d;
            background: white;
            padding: 5px 10px;
            border-radius: 30px;
            max-width: 180px;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.85rem;
            border: 1px solid rgba(0, 90, 157, 0.3);
            font-weight: 500;
        }

        .status-message {
            background: #f0f5fa;
            border-radius: 30px;
            padding: 10px 14px;
            margin-top: 5px;
            text-align: center;
            font-size: 0.9rem;
            border-left: 4px solid #005a9d;
            color: #333;
        }

        .status-message.victory {
            border-left-color: #ffd700;
            background: #fff9e6;
            color: #005a9d;
            font-weight: 600;
        }

        footer {
            text-align: center;
            color: #999;
            font-size: 0.65rem;
            margin-top: 18px;
            border-top: 1px solid rgba(0, 90, 157, 0.1);
            padding-top: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border: 2px solid #005a9d;
            border-radius: 48px;
            padding: 30px;
            max-width: 350px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 90, 157, 0.3);
        }

        .modal-content h2 {
            color: #005a9d;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }

        .modal-content p {
            color: #666;
            margin-bottom: 20px;
        }

        .name-input {
            width: 100%;
            padding: 12px 16px;
            background: #f0f5fa;
            border: 2px solid #005a9d;
            border-radius: 40px;
            color: #333;
            font-size: 1rem;
            margin-bottom: 15px;
            outline: none;
        }

        .name-input:focus {
            border-color: #003d6b;
            box-shadow: 0 0 15px rgba(0, 90, 157, 0.3);
        }

        .save-btn {
            background: #005a9d;
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid #005a9d;
        }

        .save-btn:hover {
            background: #003d6b;
            transform: scale(1.05);
        }

        @media (max-width: 400px) {
            .tap-button {
                width: 180px;
                height: 180px;
                font-size: 2rem;
                margin: 15px auto 20px auto;
            }
            .megawatt-value {
                font-size: 3.5rem;
            }
            .logo-container img {
                max-width: 180px;
            }
        }
    </style>
</head>
<body>
    <div class="animation-container" id="animationContainer"></div>

    <div class="modal active" id="nameModal">
        <div class="modal-content">
            <h2>⚡ ДОБРО ПОЖАЛОВАТЬ!</h2>
            <p>Введите ваше имя для участия</p>
            <input type="text" class="name-input" id="userNameInput" placeholder="Ваше имя" maxlength="20">
            <button class="save-btn" onclick="saveUserName()">НАЧАТЬ</button>
        </div>
    </div>

    <div class="game-container">
        <div class="logo-container">
            <img src="log_PNG.png" alt="Россети Московский регион">
        </div>
        
        <h1>⚡ ЭНЕРГОТАП</h1>
        <div class="subtitle">Выработка электроэнергии</div>
        
        <div class="energy-card">
            <div class="stats-row">
                <span class="badge">⚡ общая энергия</span>
            </div>
            <div class="megawatt-value" id="counter">0</div>
            <div class="mw-label">МЕГАВАТТ</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
        
        <button class="tap-button disabled" id="tapBtn" style="display: none;">ТАП</button>
        
        <div class="victory-message" id="victoryMessage" style="display: none;">
            🎉 ЦЕЛЬ ДОСТИГНУТА! 🎉
        </div>
        
        <div class="user-info" style="display: none;" id="userInfo">
            <span class="user-id-label">👤 УЧАСТНИК</span>
            <span class="user-id-value" id="userNameDisplay">загрузка...</span>
        </div>
        
        <div class="status-message" id="statusMessage" style="display: none;">
            ⏳ Ожидание начала игры... ⏳
        </div>
        
        <footer style="display: none;" id="footer">
            * результаты сохраняются в облаке
        </footer>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbyr-oo1u-8WEdvBrJkR1RcRfAEC2lie69aSkxrPWy1KglJx9SWIolReclyTdxu3wAmk/exec';
        const SAVE_INTERVAL = 20;
        const MAX_ENERGY = 1000; // Общая цель для всех участников
        
        let userName = '';
        let userId = '';
        let gameStarted = false;
        let totalEnergy = 0; // Общая энергия с сервера
        
        // Функция анимации молний
        function createTapAnimation() {
            const container = document.getElementById('animationContainer');
            const button = document.getElementById('tapBtn');
            const buttonRect = button.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            
            const centerX = buttonRect.left + buttonRect.width / 2 - containerRect.left;
            const centerY = buttonRect.top + buttonRect.height / 2 - containerRect.top;
            
            for (let i = 0; i < 5; i++) {
                const lightning = document.createElement('div');
                lightning.className = 'lightning';
                lightning.innerHTML = '⚡';
                
                const randomAngle = Math.random() * Math.PI * 2;
                const randomRadius = 80 + Math.random() * 100;
                
                const sparkX = centerX + Math.cos(randomAngle) * randomRadius;
                const sparkY = centerY + Math.sin(randomAngle) * randomRadius;
                
                lightning.style.left = sparkX + 'px';
                lightning.style.top = sparkY + 'px';
                
                const size = 1.5 + Math.random() * 2;
                lightning.style.fontSize = size + 'rem';
                
                container.appendChild(lightning);
                setTimeout(() => lightning.remove(), 800);
            }
        }
        
        // Обновление прогресс-бара и блокировка кнопки при достижении цели
        function updateProgress() {
            const percent = Math.min(100, Math.round((totalEnergy / MAX_ENERGY) * 100));
            document.getElementById('progressBar').style.width = percent + '%';
            
            if (totalEnergy >= MAX_ENERGY) {
                document.getElementById('tapBtn').classList.add('disabled');
                document.getElementById('victoryMessage').style.display = 'block';
                document.getElementById('statusMessage').classList.add('victory');
                document.getElementById('statusMessage').innerHTML = '🎉 ПОБЕДА! Цель достигнута! 🎉';
            }
        }
        
        // Запрос общей энергии с сервера
        async function fetchTotalEnergy() {
            try {
                const response = await fetch(API_URL + '?t=' + Date.now());
                const data = await response.json();
                if (data.success && data.data) {
                    const newTotal = data.data.reduce((sum, p) => sum + (p.taps || 0), 0);
                    totalEnergy = newTotal;
                    document.getElementById('counter').innerText = totalEnergy;
                    updateProgress();
                }
            } catch(error) {
                console.error('Ошибка получения общей энергии:', error);
            }
        }
        
        // Проверка статуса игры (началась ли)
        async function checkGameStatus() {
            try {
                const response = await fetch(API_URL + '?status=1&t=' + Date.now());
                const data = await response.json();
                
                if (data.success) {
                    gameStarted = data.active;
                    
                    if (gameStarted) {
                        document.getElementById('statusMessage').innerHTML = '✅ ИГРА НАЧАЛАСЬ! Тапай! ✅';
                        if (totalEnergy < MAX_ENERGY && userName) {
                            document.getElementById('tapBtn').classList.remove('disabled');
                        }
                    } else {
                        document.getElementById('statusMessage').innerHTML = '⏳ Ожидание начала игры... ⏳';
                        document.getElementById('tapBtn').classList.add('disabled');
                    }
                }
            } catch(error) {
                console.error('Ошибка проверки статуса:', error);
            }
        }
        
        // Сохранение имени и инициализация
        function saveUserName() {
            const name = document.getElementById('userNameInput').value.trim();
            if (!name) { alert('Введите имя'); return; }
            
            userName = name;
            userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
            
            document.getElementById('nameModal').classList.remove('active');
            document.getElementById('tapBtn').style.display = 'flex';
            document.getElementById('userInfo').style.display = 'flex';
            document.getElementById('statusMessage').style.display = 'block';
            document.getElementById('footer').style.display = 'block';
            
            document.getElementById('userNameDisplay').textContent = userName;
            
            window.personalCounter = 0;
            window.lastSavedCounter = 0;
            
            // Запускаем периодическое обновление
            fetchTotalEnergy();
            setInterval(fetchTotalEnergy, 5000);
            checkGameStatus();
            setInterval(checkGameStatus, 3000);
        }
        
        window.personalCounter = 0;
        window.lastSavedCounter = 0;
        
        // Отправка личного прогресса на сервер
        async function sendTapsToServer(tapsValue) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.innerText = '⏳ Отправка...';
            
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: userId,
                        userName: userName || 'Аноним',
                        taps: tapsValue
                    })
                });
                
                window.lastSavedCounter = tapsValue;
                statusEl.innerText = '✅ Сохранено! Личный вклад: ' + tapsValue + ' МВт';
            } catch(e) {
                statusEl.innerText = '❌ Ошибка';
            }
        }
        
        // Обработка тапа
        function handleTap() {
            if (!userName) {
                document.getElementById('nameModal').classList.add('active');
                return;
            }
            
            if (!gameStarted) {
                document.getElementById('statusMessage').innerHTML = '⏳ Игра ещё не началась! Ждите команды ведущего... ⏳';
                return;
            }
            
            if (totalEnergy >= MAX_ENERGY) {
                return;
            }
            
            createTapAnimation();
            
            window.personalCounter++;
            
            if (window.personalCounter % SAVE_INTERVAL === 0) {
                sendTapsToServer(window.personalCounter);
            } else {
                document.getElementById('statusMessage').innerText = `⚡ +1! Ваш вклад: ${window.personalCounter} МВт`;
            }
            
            // Анимация кнопки
            const btn = document.getElementById('tapBtn');
            btn.classList.add('button-press');
            btn.classList.add('button-pulse');
            
            setTimeout(() => {
                btn.classList.remove('button-press');
                btn.classList.remove('button-pulse');
            }, 300);
            
            if (navigator.vibrate) navigator.vibrate(20);
        }

        document.getElementById('tapBtn').addEventListener('click', handleTap);
        document.getElementById('tapBtn').addEventListener('touchstart', (e) => {
            e.preventDefault();
            handleTap();
        });
    </script>
</body>
</html>
