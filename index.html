<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>РОССЕТИ | ЭНЕРГОТАП</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f5f5f5, #e0e0e0);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .game-container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 48px;
            padding: 24px 20px 32px;
            box-shadow: 0 25px 50px rgba(0, 90, 157, 0.2);
            border: 1px solid rgba(0, 90, 157, 0.2);
        }

        /* Логотип */
        .logo-container {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px 0;
            border-bottom: 2px solid rgba(0, 90, 157, 0.1);
        }

        .logo-container svg {
            max-width: 200px;
            height: auto;
        }

        .company-name {
            font-size: 1.2rem;
            font-weight: 600;
            color: #005a9d;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            color: #005a9d;
            margin-bottom: 4px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 1rem;
            margin-bottom: 24px;
            border-bottom: 1px dashed rgba(0, 90, 157, 0.3);
            padding-bottom: 16px;
        }

        .energy-card {
            background: linear-gradient(135deg, #f0f5fa, #e6ecf3);
            border-radius: 32px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid rgba(0, 90, 157, 0.3);
            box-shadow: 0 10px 0 rgba(0, 90, 157, 0.2);
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: #005a9d;
            font-size: 0.95rem;
        }

        .badge {
            background: rgba(0, 90, 157, 0.1);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.85rem;
            color: #005a9d;
            border: 1px solid rgba(0, 90, 157, 0.3);
            font-weight: 600;
        }

        .megawatt-value {
            font-size: 5rem;
            font-weight: 900;
            text-align: center;
            line-height: 1;
            color: #005a9d;
            text-shadow: 0 0 20px rgba(0, 90, 157, 0.3);
            margin: 8px 0 4px;
            letter-spacing: 4px;
        }

        .mw-label {
            text-align: center;
            color: #005a9d;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 3px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .tap-button {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #005a9d, #003d6b);
            border: none;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: 900;
            color: white;
            text-transform: uppercase;
            box-shadow: 0 20px 0 #002b4a, 0 30px 40px rgba(0, 90, 157, 0.4);
            transition: all 0.08s linear;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
            border: 4px solid #80b5dc;
        }

        .tap-button:active {
            transform: translateY(15px);
            box-shadow: 0 5px 0 #002b4a, 0 20px 30px rgba(0, 90, 157, 0.4);
        }

        .user-info {
            background: #f0f5fa;
            border-radius: 50px;
            padding: 14px 18px;
            margin: 16px 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(0, 90, 157, 0.3);
            font-size: 0.9rem;
        }

        .user-id-label {
            color: #005a9d;
            font-weight: 600;
        }

        .user-id-value {
            color: #005a9d;
            background: white;
            padding: 6px 12px;
            border-radius: 30px;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.9rem;
            border: 1px solid rgba(0, 90, 157, 0.3);
            font-weight: 500;
        }

        .status-message {
            background: #f0f5fa;
            border-radius: 30px;
            padding: 12px 16px;
            margin-top: 16px;
            text-align: center;
            font-size: 0.95rem;
            border-left: 4px solid #005a9d;
            color: #333;
        }

        .tap-hint {
            text-align: center;
            color: #666;
            font-size: 0.85rem;
            margin-top: 8px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        footer {
            text-align: center;
            color: #999;
            font-size: 0.7rem;
            margin-top: 24px;
            border-top: 1px solid rgba(0, 90, 157, 0.1);
            padding-top: 16px;
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border: 2px solid #005a9d;
            border-radius: 48px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 90, 157, 0.3);
        }

        .modal-content h2 {
            color: #005a9d;
            font-size: 2rem;
            margin-bottom: 20px;
        }

        .modal-content p {
            color: #666;
            margin-bottom: 30px;
        }

        .name-input {
            width: 100%;
            padding: 15px 20px;
            background: #f0f5fa;
            border: 2px solid #005a9d;
            border-radius: 40px;
            color: #333;
            font-size: 1.1rem;
            margin-bottom: 20px;
            outline: none;
        }

        .name-input:focus {
            border-color: #003d6b;
            box-shadow: 0 0 20px rgba(0, 90, 157, 0.3);
        }

        .save-btn {
            background: #005a9d;
            border: none;
            color: white;
            padding: 15px 40px;
            border-radius: 40px;
            font-weight: 800;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid #005a9d;
        }

        .save-btn:hover {
            background: #003d6b;
            transform: scale(1.05);
        }

        @media (max-width: 400px) {
            .tap-button {
                width: 220px;
                height: 220px;
                font-size: 2.5rem;
            }
            .megawatt-value {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>
    <!-- Модальное окно для ввода имени -->
    <div class="modal" id="nameModal">
        <div class="modal-content">
            <h2>⚡ ДОБРО ПОЖАЛОВАТЬ!</h2>
            <p>Введите ваше имя для участия</p>
            <input type="text" class="name-input" id="userNameInput" placeholder="Ваше имя" maxlength="20">
            <button class="save-btn" onclick="saveUserName()">НАЧАТЬ</button>
        </div>
    </div>

    <div class="game-container">
        <!-- Логотип компании -->
        <div class="logo-container">
            <svg width="180" height="60" viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg">
                <rect x="10" y="10" width="60" height="60" fill="#005a9d" rx="12"/>
                <text x="90" y="45" font-family="Arial" font-weight="bold" font-size="28" fill="#005a9d">РОССЕТИ</text>
                <text x="90" y="65" font-family="Arial" font-size="16" fill="#666">МОСКОВСКИЙ РЕГИОН</text>
            </svg>
        </div>
        
        <h1>⚡ ЭНЕРГОТАП</h1>
        <div class="subtitle">Выработка электроэнергии</div>
        
        <div class="energy-card">
            <div class="stats-row">
                <span class="badge">⚡ накоплено</span>
                <span class="badge">1 тап = 1 МВт</span>
            </div>
            <div class="megawatt-value" id="counter">0</div>
            <div class="mw-label">МЕГАВАТТ</div>
        </div>
        
        <button class="tap-button" id="tapBtn" onclick="handleTap()">
            ТАП
        </button>
        
        <div class="user-info">
            <span class="user-id-label">👤 УЧАСТНИК</span>
            <span class="user-id-value" id="userNameDisplay">загрузка...</span>
        </div>
        
        <div class="status-message" id="statusMessage">
            👆 Тапай, чтобы вырабатывать мегаватты!
        </div>
        
        <div class="tap-hint">
            <span>📱 вибро</span>
            <span>⚡ +1 за тап</span>
            <span>💾 автосохранение</span>
        </div>
        
        <footer>
            * результаты сохраняются в облаке
        </footer>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbzMGV1nL9tpP4fm7P3oeHbVEmsoWZfpXlLriGJ8hsY3uGFvwBkqSic90ZBJaqAA9NRH/exec';
        const SAVE_INTERVAL = 5;
        
        let userName = localStorage.getItem('energyTap_userName');
        let userId = localStorage.getItem('energyTap_userId');
        
        if (!userName) {
            document.getElementById('nameModal').classList.add('active');
            if (!userId) {
                userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
                localStorage.setItem('energyTap_userId', userId);
            }
        } else {
            initializeGame();
        }
        
        function saveUserName() {
            const name = document.getElementById('userNameInput').value.trim();
            if (!name) { alert('Введите имя'); return; }
            
            userName = name;
            localStorage.setItem('energyTap_userName', userName);
            
            if (!userId) {
                userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
                localStorage.setItem('energyTap_userId', userId);
            }
            
            document.getElementById('nameModal').classList.remove('active');
            initializeGame();
            
            if (window.counter > 0) sendTapsToServer(window.counter);
        }
        
        function initializeGame() {
            document.getElementById('userNameDisplay').textContent = userName;
            window.counter = parseInt(localStorage.getItem('energyTap_counter_' + userId)) || 0;
            document.getElementById('counter').innerText = window.counter;
            window.lastSavedCounter = window.counter;
        }
        
        window.counter = 0;
        window.lastSavedCounter = 0;
        
        async function sendTapsToServer(tapsValue) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.innerText = '⏳ Отправка...';
            
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: userId,
                        userName: userName || 'Аноним',
                        taps: tapsValue,
                        timestamp: new Date().toISOString()
                    })
                });
                
                window.lastSavedCounter = tapsValue;
                localStorage.setItem('energyTap_counter_' + userId, tapsValue);
                statusEl.innerText = '✅ Сохранено! ' + tapsValue + ' МВт';
            } catch(e) {
                statusEl.innerText = '❌ Ошибка';
            }
        }
        
        function handleTap() {
            if (!userName) {
                document.getElementById('nameModal').classList.add('active');
                return;
            }
            
            window.counter++;
            document.getElementById('counter').innerText = window.counter;
            localStorage.setItem('energyTap_counter_' + userId, window.counter);
            
            if (navigator.vibrate) navigator.vibrate(20);
            
            const btn = document.getElementById('tapBtn');
            btn.style.transform = 'scale(0.92)';
            setTimeout(() => btn.style.transform = 'scale(1)', 80);
            
            if (window.counter % SAVE_INTERVAL === 0) {
                sendTapsToServer(window.counter);
            } else {
                document.getElementById('statusMessage').innerText = `⚡ +1! Всего: ${window.counter}`;
            }
        }
    </script>
</body>
</html>
