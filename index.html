<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ ЭНЕРГОТАП ⚡ Накопи мегаватты!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0b1120 0%, #1a2639 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .game-container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 48px;
            padding: 24px 20px 32px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 0, 0.2) inset;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 800;
            text-align: center;
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .subtitle {
            text-align: center;
            color: #a0b3d9;
            font-size: 1rem;
            margin-bottom: 24px;
            border-bottom: 1px dashed rgba(255,215,0,0.3);
            padding-bottom: 16px;
        }

        .energy-card {
            background: linear-gradient(135deg, #1e2a47, #131d33);
            border-radius: 32px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid #3a4a6e;
            box-shadow: 0 10px 0 #0b121f;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: #ccd6f0;
            font-size: 0.95rem;
        }

        .badge {
            background: #2a3b5a;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.85rem;
            color: #ffd700;
            border: 1px solid #ffd70033;
        }

        .megawatt-value {
            font-size: 5rem;
            font-weight: 900;
            text-align: center;
            line-height: 1;
            color: #ffd700;
            text-shadow: 0 0 30px #ffd700;
            margin: 8px 0 4px;
            letter-spacing: 4px;
        }

        .mw-label {
            text-align: center;
            color: #8096c0;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        .tap-button {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b);
            border: none;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3rem;
            font-weight: 900;
            color: #1a1a2e;
            text-transform: uppercase;
            box-shadow: 0 20px 0 #7a5c00, 0 30px 40px rgba(0,0,0,0.6), 0 0 30px #ffd70080;
            transition: all 0.08s linear;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
            border: 4px solid #fff2b5;
        }

        .tap-button:active {
            transform: translateY(15px);
            box-shadow: 0 5px 0 #7a5c00, 0 20px 30px rgba(0,0,0,0.6), 0 0 40px #ffd700;
        }

        .user-info {
            background: #0e1626;
            border-radius: 50px;
            padding: 14px 18px;
            margin: 16px 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #3d4f72;
            font-size: 0.9rem;
        }

        .user-id-label {
            color: #7185aa;
        }

        .user-id-value {
            color: #ffd700;
            font-family: monospace;
            background: #1f2a3f;
            padding: 6px 12px;
            border-radius: 30px;
            max-width: 160px;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 0.8rem;
        }

        .status-message {
            background: #1d2a3e;
            border-radius: 30px;
            padding: 12px 16px;
            margin-top: 16px;
            text-align: center;
            font-size: 0.95rem;
            border-left: 4px solid #ffd700;
            color: #b0c4e0;
            transition: all 0.3s;
        }

        .tap-hint {
            text-align: center;
            color: #62779b;
            font-size: 0.85rem;
            margin-top: 8px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        footer {
            text-align: center;
            color: #354668;
            font-size: 0.7rem;
            margin-top: 24px;
            border-top: 1px solid #1f2b40;
            padding-top: 16px;
        }

        @media (max-width: 400px) {
            .tap-button {
                width: 220px;
                height: 220px;
                font-size: 2.5rem;
            }
            .megawatt-value {
                font-size: 4rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>⚡ ЭНЕРГОТАП</h1>
        <div class="subtitle">Выработка электроэнергии</div>
        
        <div class="energy-card">
            <div class="stats-row">
                <span class="badge">⚡ накоплено</span>
                <span class="badge">1 тап = 1 МВт</span>
            </div>
            <div class="megawatt-value" id="counter">0</div>
            <div class="mw-label">МЕГАВАТТ</div>
        </div>
        
        <button class="tap-button" id="tapBtn" onclick="handleTap()">
            ТАП
        </button>
        
        <div class="user-info">
            <span class="user-id-label">🔑 МОЙ ID</span>
            <span class="user-id-value" id="userId">загрузка...</span>
        </div>
        
        <div class="status-message" id="statusMessage">
            👆 Тапай, чтобы вырабатывать мегаватты!
        </div>
        
        <div class="tap-hint">
            <span>📱 вибро</span>
            <span>⚡ +1 за тап</span>
            <span>💾 автосохранение</span>
        </div>
        
        <footer>
            * результаты сохраняются в облаке
        </footer>
    </div>

    <script>
        // ⚡ ВАШ URL ИЗ ШАГА 2
        const API_URL = 'https://script.google.com/macros/s/AKfycbzMGV1nL9tpP4fm7P3oeHbVEmsoWZfpXlLriGJ8hsY3uGFvwBkqSic90ZBJaqAA9NRH/exec';
        const SAVE_INTERVAL = 5;
        
        let userId = localStorage.getItem('energyTap_userId');
        if (!userId) {
            userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
            localStorage.setItem('energyTap_userId', userId);
        }
        
        let userName = localStorage.getItem('energyTap_userName') || 'Участник';
        let counter = parseInt(localStorage.getItem('energyTap_counter_' + userId)) || 0;
        let lastSavedCounter = counter;
        
        document.getElementById('counter').innerText = counter;
        document.getElementById('userId').innerText = userId.substring(0, 12) + '...';
        
        async function sendTapsToServer(tapsValue) {
            const statusEl = document.getElementById('statusMessage');
            statusEl.innerText = '⏳ Отправка данных...';
            
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        userId: userId,
                        userName: userName,
                        taps: tapsValue,
                        userAgent: navigator.userAgent.substring(0, 100),
                        timestamp: new Date().toISOString()
                    })
                });
                
                lastSavedCounter = tapsValue;
                localStorage.setItem('energyTap_counter_' + userId, tapsValue);
                statusEl.innerText = '✅ Данные сохранены! Всего: ' + tapsValue + ' МВт';
            } catch(error) {
                statusEl.innerText = '❌ Ошибка, но данные сохранены локально';
            }
        }
        
        function handleTap() {
            counter++;
            document.getElementById('counter').innerText = counter;
            localStorage.setItem('energyTap_counter_' + userId, counter);
            
            if (navigator.vibrate) navigator.vibrate(20);
            
            const btn = document.getElementById('tapBtn');
            btn.style.transform = 'scale(0.92)';
            setTimeout(() => btn.style.transform = 'scale(1)', 80);
            
            if (counter % SAVE_INTERVAL === 0) {
                sendTapsToServer(counter);
            } else {
                document.getElementById('statusMessage').innerText = `⚡ +1 МВт! Всего: ${counter}`;
            }
        }
        
        window.addEventListener('load', () => {
            if (counter > 0) setTimeout(() => sendTapsToServer(counter), 1000);
        });
    </script>
</body>
</html>
